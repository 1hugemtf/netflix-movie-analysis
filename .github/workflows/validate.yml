name: Validate notebook
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Execute notebook and verify results
        run: python validate_notebook.py
      - name: Save executed notebook and chart
        uses: actions/upload-artifact@v4
        with:
          name: executed-netflix-analysis
          path: |
            notebook.ipynb
            movie_duration.png
